name: EVM Scanner Cloud
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install eth-account web3
      - name: Start Scanner
        run: |
          python3 scanner.py
EOF
